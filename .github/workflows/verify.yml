name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run check
      - run: PI_RUN_REAL_COMPACTION_PARITY=1 bun test test/pi-parity.test.ts
      - run: bun audit
      - run: bun run release:check
      - run: bun pm pack --dry-run

  pi-compatibility:
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.80.3", "0.84.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-agent-core@${{ matrix.pi }} @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: bun run typecheck
      - run: bun test
