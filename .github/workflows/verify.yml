name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  current:
    runs-on: ubuntu-latest
    env:
      PI_ASTRA_HOST_NODE_MODULES: ${{ github.workspace }}/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile --ignore-scripts
      # Fail before tests if the stock fixture is missing or not the exact supported host.
      - run: |
          bun -e 'for (const name of ["pi-ai", "pi-agent-core", "pi-coding-agent"]) { const metadata = await Bun.file(`${process.env.PI_ASTRA_HOST_NODE_MODULES}/@earendil-works/${name}/package.json`).json(); if (metadata.version !== "1.0.0") throw new Error(`${name}: expected stock 1.0.0, got ${metadata.version}`); }'
      - run: bun test
      - run: bun run typecheck
      - run: bun run check
      - run: PI_RUN_REAL_COMPACTION_PARITY=1 bun test test/pi-parity.test.ts
      - run: bun audit
      - run: bun run release:check
      - run: bun pm pack --dry-run
